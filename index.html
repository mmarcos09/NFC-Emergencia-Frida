<!DOCTYPE html>

<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold">Frida Quetzali Montoya Delgado</h1>
            <p class="text-gray-600">Contacto de Emergencia</p>
        </div>

        <div class="mt-6">
            <a href="tel:+5255XXXXXXXX"

        <div class="mt-4 border-t pt-4">
